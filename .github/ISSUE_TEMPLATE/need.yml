name: 发布需求 (Publish a Need)
description: 维护者发布一个还没人做、可以被认领实现的解决方案需求
title: "[需求] "
labels:
  - "type:need"
  - "status:open"
body:
  - type: dropdown
    id: area
    attributes:
      label: 领域
      options:
        - elder-care 养老
        - child-friendly 儿童友好
        - animal-welfare 动物福利
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 场景描述
      description: 这个需求针对什么场景
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 验收标准
      description: 完成后应该达到什么效果，怎么判断做完了
    validations:
      required: true
