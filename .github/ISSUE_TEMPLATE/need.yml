name: "Publish a Need 发布需求"
description: "Maintainers publish a solution need that hasn't been built yet and can be claimed / 维护者发布一个还没人做、可以被认领实现的解决方案需求"
title: "[Need 需求] "
labels:
  - "type:need"
  - "status:open"
body:
  - type: dropdown
    id: area
    attributes:
      label: "Area 领域"
      options:
        - elder-care 养老
        - child-friendly 儿童友好
        - animal-welfare 动物福利
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: "Scenario 场景描述"
      description: "What scenario is this need about? / 这个需求针对什么场景"
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: "Acceptance Criteria 验收标准"
      description: "What does 'done' look like? / 完成后应该达到什么效果，怎么判断做完了"
    validations:
      required: true
