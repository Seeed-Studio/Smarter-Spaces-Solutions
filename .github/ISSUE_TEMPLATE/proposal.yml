name: "Propose a Solution 提案新方案"
description: "Propose a smart space solution for elder care, child-friendly, or animal welfare scenarios / 提一个面向养老 / 儿童友好 / 动物福利场景的智能空间解决方案"
title: "[Solution 方案] "
labels:
  - "type:proposal"
  - "status:open"
body:
  - type: dropdown
    id: area
    attributes:
      label: "Area 领域"
      options:
        - elder-care 养老
        - child-friendly 儿童友好
        - animal-welfare 动物福利
        - other / unsure 其他 / 不确定
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem 要解决的问题"
      description: "What scenario or pain point does this solution address? / 这个方案针对什么场景 / 痛点"
    validations:
      required: true
  - type: textarea
    id: composition
    attributes:
      label: "Composition 方案组成"
      description: "What modules, devices, AI capabilities, or other resources does it use? Free-form, optional. / 用到哪些模块、设备、AI 能力或其他资源（自由描述，不用的可以不填）"
    validations:
      required: false
