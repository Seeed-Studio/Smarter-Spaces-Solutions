name: 提案新方案 (Propose a Solution)
description: 提一个面向养老 / 儿童友好 / 动物福利场景的智能空间解决方案
title: "[方案] "
labels:
  - "type:proposal"
  - "status:open"
body:
  - type: dropdown
    id: area
    attributes:
      label: 领域
      options:
        - elder-care 养老
        - child-friendly 儿童友好
        - animal-welfare 动物福利
        - 其他 / 不确定
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个方案针对什么场景 / 痛点
    validations:
      required: true
  - type: textarea
    id: composition
    attributes:
      label: 方案组成
      description: 用到哪些模块、设备、AI 能力或其他资源（自由描述，不用的可以不填）
    validations:
      required: false
